<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Fine, monochrome paper grain; no cloudy wear layer or color tint. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.6" intercept="-.3"/>
      <feFuncG type="linear" slope="1.6" intercept="-.3"/>
      <feFuncB type="linear" slope="1.6" intercept="-.3"/>
      <feFuncA type="linear" slope=".065"/>
    </feComponentTransfer>
  </filter>
  <path fill="#808080" d="M0 0h320v320H0z" filter="url(#grain)"/>
</svg>
